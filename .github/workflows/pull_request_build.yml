name: Pull request build

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: set up git
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: installing
        run: npm ci

      # TODO: enabled linters
      # - name: linters
      #   uses: wearerequired/lint-action@v1
      #   with:
      #     prettier: true
      #     prettier_extensions: ts,tsx,js,jsx,json,md
      #     continue_on_error: false

      - name: testing
        run: npm test
        env:
          DISCOURSE_API_KEY: "DISCOURSE_API_KEY"

      - name: building
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: governance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/governance_test
      # Not a secret: the bid payload column is encrypted at rest, and the round trip only runs if
      # both halves use the same key.
      DB_ENCRYPTION_KEY: integration-test-key

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: set up git
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: installing
        run: npm ci

      - name: run migrations
        run: npm run migrate:test

      - name: integration tests
        run: npm run test:integration